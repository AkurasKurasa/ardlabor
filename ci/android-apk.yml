# Builds the ARdlabor Android APK on GitHub's servers. Download it from the run's "Artifacts".
name: Android APK
on:
  push:
    branches: [main]
    paths: ["app/**", "core/**", ".github/workflows/android-apk.yml"]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: app/yarn.lock
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: yarn install --frozen-lockfile
      - run: npx tsc --noEmit
      - run: npx expo prebuild --platform android --no-install
      # arm64 only: every ARCore phone is 64-bit, and it halves the build time
      - run: cd android && ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a
      - uses: actions/upload-artifact@v4
        with:
          name: ardlabor-apk
          path: app/android/app/build/outputs/apk/release/*.apk
